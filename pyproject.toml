[project]
name = "forest"
version = "0.3.0"
description = "Personal knowledge base + task planner: markdown vaults in git, web UI, TUI, CLI, REST API and MCP."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "typer",
  "rich",
  "textual>=1.0",
  "python-frontmatter",
  "pyyaml",
  "pydantic>=2",
  "mcp>=2.2,<3",
  "itsdangerous",
  "python-multipart",
  "httpx",
  "pypdf",
  "markdownify",
  "readability-lxml",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "playwright"]

[project.scripts]
forest = "forest.cli:app"
forest-tui = "forest.tui:main"
forest-api = "forest.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access"]
