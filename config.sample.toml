# forest.toml - optional local config (environment variables override everything here).
# For Docker use .env instead (see .env.example).

[server]
host = "127.0.0.1"                 # "0.0.0.0" to listen on all interfaces
port = 7000
# public_url = "https://tools.example.com"

[forest]
data = "~/org/forest-data"         # vaults/<name>/ + .forest/ (tokens, audit log)
vaults = "forest,tasks"
timezone = "UTC"
# journal = "forest:journal"
# inbox = "forest:inbox"
# templates = "forest:_templates"
# max_upload_mb = 25

# Point vaults at existing folders instead of <data>/vaults/<name>:
# [vaults]
# forest = "~/org/forest"
# tasks = "~/org/tasks"

[auth]
# password = ""                    # or FOREST_PASSWORD; unset = no login (localhost only!)
# session_secret = ""              # or FOREST_SECRET; auto-generated if unset

# [ntfy]
# url = "https://ntfy.sh"
# topic = "long-random-topic-name"
# token = ""
# digest_time = "08:00"
# weekly_time = "sun 19:00"
