<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>forest capture</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/lib/theme.css">
<style>
body { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
h1 a { font-size: 12px; font-weight: normal; color: var(--dim); text-decoration: none; }
.fl { font-size: 12px; color: var(--dim); margin: 10px 0 2px; }
input[type=text], textarea, select { width: 100%; }
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.opts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 10px; }
.actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 14px; }
.actions button { padding: 5px 14px; font-size: 13px; }
#result { margin-top: 12px; font-size: 12px; }
</style>
</head>
<body>
<h1>capture <a href="/">forest</a></h1>
<form id="f">
  <div class="fl">title</div>
  <input type="text" id="title" placeholder="(from page / first line)">
  <div class="fl">url</div>
  <input type="text" id="url" placeholder="https://...">
  <div class="fl">note / selected text</div>
  <textarea id="text" placeholder="..."></textarea>
  <div class="fl">save to</div>
  <select id="where"></select>
  <div class="fl">tags</div>
  <input type="text" id="tags" placeholder="tag, tag">
  <div class="opts">
    <label><input type="checkbox" id="fetch"> save article copy (markdown)</label>
    <label><input type="checkbox" id="task"> as task (todo)</label>
  </div>
  <div class="actions">
    <button type="button" onclick="done()">cancel</button>
    <button type="submit" class="primary">save [Enter]</button>
  </div>
</form>
<div id="result"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (localStorage.getItem('f-theme') === 'dark') document.body.classList.add('theme-dark');

// Prefill from query (bookmarklet) or Android share target (url often arrives inside text)
const q = new URLSearchParams(location.search);
let url = q.get('url') || '', text = q.get('text') || '';
if (!url) {
  const m = text.match(/https?:\/\/\S+/);
  if (m) { url = m[0]; text = text.replace(m[0], '').trim(); }
}
$('title').value = q.get('title') || '';
$('url').value = url;
$('text').value = text;
$('fetch').checked = localStorage.getItem('clip-fetch') === '1';

function done() { if (window.opener) window.close(); else location.href = '/'; }

(async () => {
  const r = await fetch('/api/me');
  if (r.status === 401 || r.redirected) { location.href = '/auth/login?next=' + encodeURIComponent(location.pathname + location.search); return; }
  const me = await r.json();
  const opts = [['', 'inbox']];
  if (me.vaults.includes('tasks')) opts.push(['tasks:', 'tasks (unsorted)']);
  const last = localStorage.getItem('clip-where') || '';
  $('where').innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}" ${v === last ? 'selected' : ''}>${esc(l)}</option>`).join('');
  (q.get('title') || text ? $('tags') : $('title')).focus();
})();

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    title: $('title').value.trim() || null, url: $('url').value.trim() || null, text: $('text').value,
    where: $('where').value || null, fetch: $('fetch').checked && !!$('url').value.trim(),
    tags: $('tags').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean),
    as_task: $('task').checked,
  };
  if (!body.title && !body.url && !body.text.trim()) return;
  localStorage.setItem('clip-where', $('where').value);
  localStorage.setItem('clip-fetch', $('fetch').checked ? '1' : '0');
  $('result').textContent = body.fetch ? 'saving and fetching article...' : 'saving...';
  const r = await fetch('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'forest' }, body: JSON.stringify(body) });
  if (!r.ok) { $('result').innerHTML = '<span style="color:var(--bad)">' + esc(await r.text()) + '</span>'; return; }
  const p = await r.json();
  $('result').innerHTML = `saved: <a href="/#${esc(p.vault)}/${esc(p.path)}">${esc(p.vault)}:${esc(p.path)}</a>`;
  setTimeout(done, window.opener ? 900 : 1500);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') done(); });
</script>
</body>
</html>
