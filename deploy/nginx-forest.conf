# nginx on the front server (the one with the public IP), proxying over the VPN
# to the homeserver running the forest container.
#   certbot certonly --nginx -d tools.example.com
# Save as /etc/nginx/sites-available/forest.conf (many setups only include sites-enabled/*.conf).
# Replace 10.8.0.2:7700 with BIND_IP:PORT from .env.

limit_req_zone $binary_remote_addr zone=forest_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;          # IPv6 too, or AAAA-record visitors hit the default server instead
    server_name tools.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                # nginx >= 1.25.1; on older nginx use "listen 443 ssl http2;" instead
    server_name tools.example.com;

    ssl_certificate     /etc/letsencrypt/live/tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # >= FOREST_MAX_UPLOAD_MB (attachments, backup restore, git push)
    client_max_body_size 30m;

    location = /auth/login {
        limit_req zone=forest_login burst=5 nodelay;
        proxy_pass http://10.8.0.2:7700;
        include /etc/nginx/snippets/forest-proxy.conf;
    }

    location / {
        proxy_pass http://10.8.0.2:7700;
        include /etc/nginx/snippets/forest-proxy.conf;
    }
}

