# docker compose up -d --build
#
# All data stays on the host, in the directories set in .env:
#   VAULTS_DIR/forest, VAULTS_DIR/tasks   the vaults (plain .md files, each a git repo)
#   STATE_DIR                             tokens, audit log, session secret, oauth clients
# Nothing is stored inside the container or in a Docker volume.
services:
  forest:
    build: .
    image: forest:latest
    container_name: forest
    restart: unless-stopped
    env_file: .env
    # Run as your host user so files on the host stay owned by you (id -u / id -g)
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Bind to the homeserver's VPN address so only nginx (over the VPN) can reach it.
      - "${BIND_IP:-127.0.0.1}:${PORT:-7700}:7000"
    volumes:
      # create_host_path: false -> refuse to start if the folders don't exist (e.g. a data disk
      # that isn't mounted yet) instead of silently creating empty ones on the wrong disk.
      - type: bind
        source: ${VAULTS_DIR:?set VAULTS_DIR in .env}
        target: /data/vaults
        bind:
          create_host_path: false
      - type: bind
        source: ${STATE_DIR:?set STATE_DIR in .env}
        target: /data/.forest
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
